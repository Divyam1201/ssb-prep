<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturette Deck — Practice Draw</title>
<style>
  :root{
    --ink:#12161B;
    --ink-2:#191F26;
    --olive:#454F3E;
    --olive-dark:#333B2C;
    --parchment:#F0EAD9;
    --parchment-2:#E7DFC9;
    --gold:#C6A15B;
    --gold-dim:#9C8256;
    --veasy:#5C8D6E;
    --easy:#3E7C93;
    --moderate:#B8813A;
    --high:#A6413C;
    --text-dark:#242018;
    --text-soft:#54503F;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(198,161,91,0.08), transparent 45%),
      var(--ink);
    color:var(--parchment);
    font-family:Georgia,'Times New Roman',serif;
    padding:48px 20px 80px;
  }

  header{
    max-width:920px;
    margin:0 auto 40px;
    text-align:left;
    border-bottom:1px solid rgba(198,161,91,0.25);
    padding-bottom:24px;
  }

  h1{
    font-size:clamp(28px,4vw,42px);
    font-weight:400;
    letter-spacing:0.3px;
    margin:0 0 10px;
    color:var(--parchment);
  }

  header p{
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:15px;
    line-height:1.6;
    color:#B9BCB4;
    max-width:640px;
    margin:0 0 22px;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:18px;
    font-family:'Segoe UI',system-ui,sans-serif;
  }

  #shuffleBtn{
    background:var(--gold);
    color:#1c1f16;
    border:none;
    padding:11px 22px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.2px;
    border-radius:3px;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  #shuffleBtn:hover{ background:#d4b06e; }
  #shuffleBtn:active{ transform:scale(0.97); }
  #shuffleBtn:focus-visible{ outline:2px solid var(--parchment); outline-offset:3px; }

  .legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:13px;
    color:#AEB2A6;
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .swatch{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  main{
    max-width:920px;
    margin:0 auto;
  }

  .deck{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:20px;
  }

  .card{
    perspective:1200px;
    height:230px;
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.6s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }

  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }

  .card-face{
    position:absolute;
    inset:0;
    border-radius:6px;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
  }

  .card-back{
    background:
      repeating-linear-gradient(135deg, rgba(198,161,91,0.06) 0 2px, transparent 2px 14px),
      var(--olive);
    border:1px solid var(--olive-dark);
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }

  .card-back .mark{
    width:38px;
    height:38px;
    border:1px solid var(--gold-dim);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:14px;
    font-family:'Segoe UI',system-ui,sans-serif;
    letter-spacing:0.5px;
  }

  .card-back .label{
    margin-top:12px;
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:10px;
    letter-spacing:2px;
    color:#A9B39D;
  }

  .card-front{
    background:var(--parchment);
    transform:rotateY(180deg);
    padding:16px 14px;
    justify-content:space-between;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
    border:1px solid var(--parchment-2);
  }

  .topic-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:6px 0;
    border-bottom:1px solid rgba(84,80,63,0.14);
  }
  .topic-row:last-child{ border-bottom:none; }

  .tier-tag{
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:9px;
    letter-spacing:0.8px;
    color:#fff;
    padding:2px 6px;
    border-radius:3px;
    flex-shrink:0;
    text-transform:uppercase;
  }

  .topic-name{
    font-size:13.5px;
    line-height:1.3;
    color:var(--text-dark);
  }

  .tier-veasy{ background:var(--veasy); }
  .tier-easy{ background:var(--easy); }
  .tier-moderate{ background:var(--moderate); }
  .tier-high{ background:var(--high); }

  .swatch.veasy{ background:var(--veasy); }
  .swatch.easy{ background:var(--easy); }
  .swatch.moderate{ background:var(--moderate); }
  .swatch.high{ background:var(--high); }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition:none; }
  }

  footer{
    max-width:920px;
    margin:40px auto 0;
    font-family:'Segoe UI',system-ui,sans-serif;
    font-size:12.5px;
    color:#7C8074;
  }
</style>
</head>
<body>

<header>
  <h1>Lecturette Practice Deck</h1>
  <p>Sixteen cards, each holding a spread from very easy to high difficulty. Click a card to reveal your draw. Shuffle to re-deal the whole deck into a fresh, unrepeated layout.</p>
  <div class="controls">
    <button id="shuffleBtn">Shuffle deck</button>
  </div>
</header>

<main>
  <div class="deck" id="deck"></div>
</main>

<footer>62 topics in the pool · 15 full four-tier cards + 1 bonus card each shuffle.</footer>

<script>
const TOPICS = {
  veasy: [
    "My Favourite Actor","Podcast","E-Books","OTT Platforms","Co-Education",
    "Leadership Qualities","Information is Power","Swachh Bharat Abhiyan",
    "Role of Youth in Nation Building","Mental Health Awareness","Pollution",
    "Digital India","Illiteracy","Rural Development","Indian Railways","Skill Development"
  ],
  easy: [
    "Organic Farming","Role of Media","Women Empowerment","Make in India",
    "Covid Vaccine","Information Technology","Startup Culture","Transportation in India",
    "Ayushman Bharat","Corruption in India","Technology in Agriculture & Start-ups",
    "Smart Cities","Renewable Energy","National Integration","Population Problem"
  ],
  moderate: [
    "Artificial Intelligence","Deep Fake","Women in Defence","Cyber Security",
    "Migration","Data Privacy","Population: Asset or Liability","Right to Information (RTI)",
    "Brain Drain","Cybercrime","Disaster Management","Dark Web","Media Ethics","UGC",
    "Information Explosion"
  ],
  high: [
    "BRICS","CPEC","Defence Modernisation","Drone Warfare","Indo-US Relations",
    "Article 370","Space Warfare","DRDO","India-China Relations","Terrorism – A Global Threat",
    "Reservation","Compulsory Military Training","Internal Security","Role of Armed Forces",
    "Space Technology","Drone Technology"
  ]
};

const TIER_LABEL = { veasy:"Very Easy", easy:"Easy", moderate:"Moderate", high:"High" };

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  const veasy = shuffle(TOPICS.veasy);
  const easy = shuffle(TOPICS.easy);
  const moderate = shuffle(TOPICS.moderate);
  const high = shuffle(TOPICS.high);

  const cards = [];
  for(let i=0;i<15;i++){
    cards.push(shuffle([
      {tier:"veasy", name:veasy[i]},
      {tier:"easy", name:easy[i]},
      {tier:"moderate", name:moderate[i]},
      {tier:"high", name:high[i]}
    ]));
  }
  // bonus card with the two leftover topics (veasy and high each have 16, others 15)
  cards.push(shuffle([
    {tier:"veasy", name:veasy[15]},
    {tier:"high", name:high[15]}
  ]));

  return shuffle(cards);
}

function render(){
  const deck = buildDeck();
  const container = document.getElementById("deck");
  container.innerHTML = "";

  deck.forEach((cardTopics, idx) => {
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    card.setAttribute("aria-label", "Card " + (idx+1) + ", face down. Press to reveal topics.");

    const inner = document.createElement("div");
    inner.className = "card-inner";

    const back = document.createElement("div");
    back.className = "card-face card-back";
    back.innerHTML = '<div class="mark">' + (idx+1) + '</div><div class="label">DRAW</div>';

    const front = document.createElement("div");
    front.className = "card-face card-front";
    front.innerHTML = cardTopics.map(t =>
      '<div class="topic-row"><span class="topic-name">' + t.name + '</span></div>'
    ).join("");

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);

    const toggle = () => card.classList.toggle("flipped");
    card.addEventListener("click", toggle);
    card.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        toggle();
      }
    });

    container.appendChild(card);
  });
}

document.getElementById("shuffleBtn").addEventListener("click", render);
render();
</script>

</body>
</html>
